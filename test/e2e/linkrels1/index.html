<head>
    <script src="/dist/index.min.js"></script>
    <script src="/analytics.js"></script>
    <!-- Ignored rels should not affect TTVC; add them asynchronously -->
    <script>
      window.addEventListener('load', () => {
        const rels = [
          {rel: 'preconnect', href: 'https://example.com'},
          {rel: 'dns-prefetch', href: '//example.com'},
          {rel: 'prefetch', href: '/styles.css?delay=1000'},
          {rel: 'preload', href: '/styles.css?delay=1000', as: 'style'},
          {rel: 'prerender', href: '/stub.html?delay=1000'},
          {rel: 'canonical', href: '/'},
        ];
  
        rels.forEach((cfg) => {
          const link = document.createElement('link');
          link.rel = cfg.rel;
          link.href = cfg.href;
          if (cfg.as) link.as = cfg.as;
          document.head.appendChild(link);
        });
      });
    </script>
  </head>
  
  <body>
    <h1 id="h1">Ignored link rels</h1>
  </body>
