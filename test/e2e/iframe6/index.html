<head>
  <script src="/dist/index.min.js"></script>
  <script src="/analytics.js"></script>
</head>

<body>
  <h1 id="h1">Hello world!</h1>

  <script>
    const PAGE_IFRAME_WIDTH = '200px';
    const PAGE_IFRAME_HEIGHT = '120px';

    const iframe = document.createElement('iframe');
    iframe.style.width = PAGE_IFRAME_WIDTH;
    iframe.style.height = PAGE_IFRAME_HEIGHT;
    iframe.srcdoc = `
      <!doctype html>
      <html>
        <head>
          <style>body { margin: 0; font-family: sans-serif; }</style>
        </head>
        <body>
          <div id="root">initial</div>
          <script>
            const IFRAME_AJAX_DELAY = 300;
            const IMAGE_DELAY = 400;

            // Simulate AJAX using parent's fetch instrumentation (analytics.js patches fetch)
            parent.fetch('/api?delay=' + IFRAME_AJAX_DELAY)
              .then(() => {
                // Now load an image inside the iframe; we DON'T hold network here
                const img = document.createElement('img');
                img.width = 10; img.height = 10;
                img.addEventListener('load', () => {
                  // Mutate the DOM at image load to mark a visible change at this time
                  const root = document.getElementById('root');
                  const mark = document.createElement('div');
                  mark.textContent = 'image-loaded';
                  root.appendChild(mark);
                }, { once: true });
                // Start image request with a delay
                img.src = '/150.png?delay=' + IMAGE_DELAY;
                document.body.appendChild(img);
              });
          <\/script>
        </body>
      </html>`;

    // Append iframe after window load to align with other tests
    window.addEventListener('load', () => document.body.appendChild(iframe));
  </script>
</body>
